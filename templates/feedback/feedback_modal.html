<!-- Global In-App Feedback Modal (Issue #8) -->
<div id="feedbackModal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 font-sans">
    <div class="bg-slate-900 border border-slate-700 rounded-lg max-w-lg w-full p-6 relative space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
                <h3 class="text-base font-bold text-white">Give In-App Feedback</h3>
                <p class="text-xs text-slate-400">Tell the product team what happened and what would improve your workflow.</p>
            </div>
            <button onclick="document.getElementById('feedbackModal').classList.add('hidden')" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
        </div>

        <form method="post" action="{% url 'submit_feedback' %}" class="space-y-3">
            {% csrf_token %}

            <input type="hidden" name="page_url" value="{{ request.build_absolute_uri }}">
            <input type="hidden" name="page_name" value="{% block title %}Application Page{% endblock %}">
            {% if project %}
                <input type="hidden" name="project_id" value="{{ project.id }}">
            {% endif %}

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Category</label>
                    <select name="category" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-white text-xs">
                        <option value="bug">Bug Report</option>
                        <option value="missing_capability">Missing Capability</option>
                        <option value="workflow_improvement" selected>Workflow Improvement</option>
                        <option value="confusing_interface">Confusing Interface</option>
                        <option value="performance">Performance Problem</option>
                        <option value="accessibility">Accessibility Issue</option>
                        <option value="feature_request">Feature Request</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Severity / Impact</label>
                    <select name="severity" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-white text-xs">
                        <option value="low">Low / Minor</option>
                        <option value="medium" selected>Medium / Normal</option>
                        <option value="high">High / Important</option>
                        <option value="critical">Critical / Blocker</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Feedback Summary / Title</label>
                <input type="text" name="title" placeholder="e.g. Dialogue line character tag missing" required class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-white text-xs">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">What were you trying to do?</label>
                <textarea name="what_user_was_doing" rows="2" placeholder="I was importing a screenplay dialogue block in the script workspace..." required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white text-xs leading-relaxed"></textarea>
            </div>

            <div class="bg-amber-950/40 border border-amber-800 p-3 rounded space-y-1">
                <label class="block text-xs font-bold text-amber-300">What would you ideally want to happen here?</label>
                <textarea name="ideal_result" rows="2" placeholder="I want candidate character names to auto-link to existing character identity profiles..." required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-xs leading-relaxed"></textarea>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">What actually happened? (Optional)</label>
                <textarea name="actual_result" rows="2" placeholder="The system created a standalone dialogue segment without auto-linking." class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white text-xs leading-relaxed"></textarea>
            </div>

            <div class="flex items-center justify-between pt-2">
                <span class="text-[10px] text-slate-500">Preserves page context safely. No passwords or secrets are recorded.</span>
                <div class="flex gap-2">
                    <button type="button" onclick="document.getElementById('feedbackModal').classList.add('hidden')" class="px-3 py-1.5 rounded text-xs text-slate-400 hover:text-white">Cancel</button>
                    <button type="submit" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold px-4 py-1.5 rounded text-xs">Submit Feedback</button>
                </div>
            </div>
        </form>
    </div>
</div>
