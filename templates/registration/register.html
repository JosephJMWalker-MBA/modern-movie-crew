{% extends "base.html" %}

{% block title %}Register — Modern Movie Crew{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-slate-800 border border-slate-700 rounded-lg p-6">
    <h2 class="text-2xl font-bold text-white mb-4">Create Account</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 rounded">
            Register & Continue
        </button>
    </form>
</div>
{% endblock %}
