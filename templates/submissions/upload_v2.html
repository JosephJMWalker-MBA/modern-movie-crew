{% extends "base.html" %}

{% block title %}Upload V2 — {{ submission.task.code }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-slate-800 border border-slate-700 rounded-lg p-6">
    <h2 class="text-xl font-bold text-white mb-2">Upload Revised Version (V2)</h2>
    <p class="text-xs text-slate-400 mb-6">Task: <strong class="text-amber-400">{{ submission.task.code }}</strong> - {{ submission.task.title }}</p>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Select Revised Media File (V2)</label>
            <input type="file" name="media_file" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-300 text-xs">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">External Model Used</label>
            <input type="text" name="external_tool" value="Sora v2" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Revised Prompt Used</label>
            <textarea name="prompt_used" rows="3" placeholder="Revised prompt incorporating director feedback..." class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Seed (Optional)</label>
            <input type="text" name="seed" placeholder="987654321" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded">
            Upload Immutable Version V2
        </button>
    </form>
</div>
{% endblock %}
