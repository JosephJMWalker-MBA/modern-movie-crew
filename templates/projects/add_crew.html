{% extends "base.html" %}

{% block title %}Add Crew Member — {{ project.name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-slate-800 border border-slate-700 rounded-lg p-6">
    <h2 class="text-xl font-bold text-white mb-4">Add Crew Member</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Credited Name</label>
            <input type="text" name="credited_name" required placeholder="e.g. Imani Vance" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Assign Production Role</label>
            <select name="role_id" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white">
                {% for r in roles %}
                    <option value="{{ r.id }}">{{ r.name }} ({{ r.department.name }})</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 rounded">
            Add Crew Member
        </button>
    </form>
</div>
{% endblock %}
