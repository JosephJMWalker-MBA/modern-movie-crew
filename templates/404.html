{% extends "base.html" %}

{% block title %}404 Page Not Found — Modern Movie Crew{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-16 space-y-4">
    <h1 class="text-6xl font-extrabold text-amber-500">404</h1>
    <h2 class="text-xl font-bold text-white">Page or Resource Not Found</h2>
    <p class="text-xs text-slate-400">The requested resource does not exist or you do not have permission to view it.</p>
    <a href="{% url 'dashboard' %}" class="inline-block bg-amber-600 hover:bg-amber-500 text-white font-semibold text-xs px-4 py-2 rounded">
        Return to Dashboard
    </a>
</div>
{% endblock %}
